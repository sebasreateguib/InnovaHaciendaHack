<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo sólido: la pestaña puede ser clara u oscura, el sello no debe depender de ella -->
  <rect width="32" height="32" rx="3" fill="#0a0b0d"/>
  <!-- Eje -->
  <rect x="7" y="6" width="4.5" height="20" fill="#e8e4dc"/>
  <!-- Barra intermedia, dentro de escala -->
  <rect x="7" y="14" width="12" height="5" fill="#e8e4dc"/>
  <!-- Barra que excede el umbral; se dibuja al final para ganar el cruce con el eje -->
  <rect x="7" y="6" width="18" height="5" fill="#e4a340"/>
</svg>
